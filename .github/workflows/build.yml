name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # appsettings.json в репозитории нет (секреты), но csproj копирует его в output —
      # без файла сборка падает с MSB3030.
      - name: Prepare appsettings.json
        shell: bash
        run: cp YamBassPlayer/YamBassPlayer/appsettings.example.json YamBassPlayer/YamBassPlayer/appsettings.json

      - name: Build
        working-directory: ./YamBassPlayer
        run: dotnet build --configuration Release

      - name: Test
        working-directory: ./YamBassPlayer
        run: dotnet test --configuration Release --no-build
